name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (ej: v1.0.0). Vacío = versión del pom'
        required: false
        type: string
      prerelease:
        description: 'Marcar como prerelease'
        required: false
        type: boolean
        default: false
      notes:
        description: 'Notas de la release'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JavaMid/JavaMid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Build (skip tests)
        run: mvn -B -DskipTests package

      - name: Verify executable JAR manifest
        run: |
          JAR=$(ls target/*.jar | head -n1)
          echo "Using JAR: $JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tee manifest.txt
          grep -E 'Main-Class|Start-Class|Spring-Boot-Classes' manifest.txt
          echo "Manifest verified."

      - name: Get version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine tag
        id: determine_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE=false
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            IS_PRERELEASE=${{ github.event.inputs.prerelease || 'false' }}
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH_SANITIZED=$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            TAG="v${{ steps.get_version.outputs.version }}-${BRANCH_SANITIZED}-${SHORT_SHA}"
            IS_PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -la target || true

      - name: Prepare release artifact
        id: prep_artifact
        run: |
          SRC_JAR=$(ls target/*.jar | head -n1)
          DEST_JAR="target/JavaMid-${{ steps.determine_tag.outputs.tag }}.jar"
          cp "$SRC_JAR" "$DEST_JAR"
          echo "artifact=$DEST_JAR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.determine_tag.outputs.tag }}
          name: Release ${{ steps.determine_tag.outputs.tag }}
          body: ${{ github.event.inputs.notes }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || steps.determine_tag.outputs.is_prerelease }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            JavaMid/JavaMid/${{ steps.prep_artifact.outputs.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
